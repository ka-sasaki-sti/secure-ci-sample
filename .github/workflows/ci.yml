# テストとリント。セキュリティ用の CI ではないが、
# Dependabot の更新 PR を安心して自動マージできるかはここの厚さで決まる。
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
          enable-cache: false
      - name: install (uv.lock どおり。ずれていたら失敗)
        run: uv sync --locked
      - name: lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: test
        run: uv run pytest -q
